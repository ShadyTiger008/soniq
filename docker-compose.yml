services:
  #The backend
  backend:
    build: ./backend # Tell it look in the backend folder for a Dockerfile
    ports:
      - "5000:5000" # Map port 5000 on our PC to 5000 in the container
    environment:
      - MONGODB_URI=mongodb+srv://chatterjeesoumyajeet:sLccQ1G5c90TRehg@cluster0.maccpbn.mongodb.net/?appName=Cluster0
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    ports: 
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db # keep our data safe even if container stops

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongo-data:
